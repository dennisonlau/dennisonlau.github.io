<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 40 40"
  width="32"
  height="32"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <!-- Reflective wafer surface -->
    <linearGradient
      id="header-wafer-surface"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#233657" />
      <stop offset="28%" stop-color="#507caa" />
      <stop offset="44%" stop-color="#94d5dd" />
      <stop offset="53%" stop-color="#d5c5e8" />
      <stop offset="66%" stop-color="#7775b5" />
      <stop offset="100%" stop-color="#293c60" />
    </linearGradient>

    <!-- Repeated rectangular dies and narrow scribe lanes -->
    <pattern
      id="header-wafer-dies"
      width="5"
      height="6"
      patternUnits="userSpaceOnUse"
      x="2.5"
      y="2"
    >
      <rect
        x="0.45"
        y="0.45"
        width="4.1"
        height="5.1"
        rx="0.2"
        fill="none"
        stroke="#12243d"
        stroke-opacity="0.65"
        stroke-width="0.55"
      />
      <path
        d="M0.8 5.2V0.8H4.2"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.28"
        stroke-width="0.35"
      />
    </pattern>

    <!-- Circular wafer with a small orientation notch -->
    <clipPath id="header-wafer-clip">
      <path
        d="M18 37.89
           A18 18 0 1 1 22 37.89
           L20 35.4 Z"
      />
    </clipPath>
  </defs>

  <g clip-path="url(#header-wafer-clip)">
    <circle
      cx="20"
      cy="20"
      r="18"
      fill="url(#header-wafer-surface)"
    />

    <circle
      cx="20"
      cy="20"
      r="18"
      fill="url(#header-wafer-dies)"
    />

    <!-- Diagonal reflection -->
    <path
      d="M-3 29L29-3H37L5 37Z"
      fill="#ffffff"
      opacity="0.14"
    />
  </g>

  <path
    d="M18 37.89
       A18 18 0 1 1 22 37.89
       L20 35.4 Z"
    fill="none"
    stroke="#64748b"
    stroke-opacity="0.5"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
</svg>
